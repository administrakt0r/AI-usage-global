name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy directly with Wrangler as a fallback
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aiusageglobal.pages.dev
    env:
      NEXT_PUBLIC_APP_URL: https://aiusageglobal.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare CI credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }

      - name: Verify Cloudflare configuration
        run: pnpm exec wrangler pages project list >/dev/null

      - name: Build site
        run: pnpm build

      - name: Deploy static export to Cloudflare Pages
        run: pnpm exec wrangler pages deploy out --project-name=aiusageglobal --branch=main

      - name: Verify latest post is live
        run: |
          set -euo pipefail

          latest_slug="$(node - <<'NODE'
          const fs = require('node:fs')
          const source = fs.readFileSync('src/assets/data/blog-posts.ts', 'utf8')
          const entries = [...source.matchAll(/createPost\(\{([\s\S]*?)\n  \}\)/g)].map((match) => match[1])
          const slugify = (value) => value
            .trim()
            .toLowerCase()
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .replace(/-{2,}/g, '-')
          const posts = entries.map((entry) => {
            const title = entry.match(/title: "([^"]+)"/)?.[1]
            const date = entry.match(/publishedOn: "([^"]+)"/)?.[1]
            const id = Number(entry.match(/id: (\d+)/)?.[1] ?? 0)
            return { slug: title ? slugify(title) : null, date, id }
          }).filter((post) => post.slug && post.date)
          posts.sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id)
          process.stdout.write(posts[0].slug)
          NODE
          )"

          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://aiusageglobal.pages.dev/blog-detail/${latest_slug}" >/dev/null; then
              echo "Latest post is live: ${latest_slug}"
              exit 0
            fi

            echo "Latest post ${latest_slug} is not live yet (attempt ${attempt})."
            sleep 20
          done

          echo "Latest post ${latest_slug} did not become live after deployment." >&2
          exit 1
