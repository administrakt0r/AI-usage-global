name: AUG Bot

# Autonomous news run: finds one fresh AI-resource story, writes the post,
# refreshes the AI footprint tracker when it is due, and opens a post/* PR.
# PR Checks → Auto Merge PR → Deploy Cloudflare Pages take it from there.
#
# Required secrets:
#   ANTHROPIC_API_KEY        (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`)
#   AUTO_MERGE_TOKEN         fine-grained PAT with contents + pull-requests write.
#                            Pushes made with the default GITHUB_TOKEN do not
#                            trigger other workflows, so PR Checks would never run.

on:
  schedule:
    # Four runs a day (UTC). Each run publishes at most one post; the prompt
    # also enforces a cap of 6 posts per UTC day.
    - cron: '17 1 * * *'
    - cron: '17 7 * * *'
    - cron: '17 13 * * *'
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Claude model to use
        required: false
        default: claude-sonnet-5-5

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: aug-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_APP_URL: https://aiusageglobal.pages.dev
    steps:
      - name: Check required secrets
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
        run: |
          if [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN in repository secrets."
            exit 1
          fi
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::Set AUTO_MERGE_TOKEN so bot PRs trigger PR Checks and auto-merge."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "aug-bot"
          git config user.email "aug-bot@users.noreply.github.com"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AUG Bot
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AUTO_MERGE_TOKEN }}
          display_report: true
          prompt: |
            Follow the instructions in ./newsprompt.md exactly. Read that file first.
            Today's UTC date: run `date -u +%F`.
            Repository: ${{ github.repository }}. Open the PR with `gh pr create --base main`.
          claude_args: >-
            --model ${{ inputs.model || 'claude-sonnet-5-5' }}
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,TodoWrite,Bash(pnpm:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(date:*),Bash(curl:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(jq:*),Bash(wc:*),Bash(sed -n:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(git push --force:*),Bash(git push -f:*),Bash(rm -rf:*)"
